<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0d12">
  <title>CINOVA - Movie & Series</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" id="brandHome"><span>▶</span> CINOVA</a>
    <button class="icon-button" id="refreshButton" type="button" aria-label="Perbarui database" title="Perbarui database">↻</button>
  </header>

  <main>
    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="Cari judul film atau serial..." autocomplete="off">
    </div>

    <section class="recommend-section" id="recommendSection">
      <div class="section-heading"><h2>Rekomendasi</h2><span class="recommend-label">BERGANTI OTOMATIS</span></div>
      <article class="recommend-card" id="recommendCard">
        <div class="recommend-poster" id="recommendPoster"></div>
        <div class="recommend-info">
          <h1 id="recommendTitle">Memuat rekomendasi...</h1>
          <p class="metadata" id="recommendMeta">—</p>
          <p class="recommend-description" id="recommendDescription">Pilihan CINOVA untukmu.</p>
          <button class="primary-button" id="recommendWatch" type="button" disabled>▶ Lihat</button>
        </div>
      </article>
    </section>

    <section class="catalog-section" id="catalog-section">
      <div class="section-heading">
        <h2 id="catalogTitle">Pilihan Untukmu</h2>
        <span id="filmCount" class="muted">0 judul</span>
      </div>
      <div class="filter-row" id="typeFilters" aria-label="Jenis tontonan">
        <button class="filter-chip active" data-type="all">Semua</button>
        <button class="filter-chip" data-type="movie">Film</button>
        <button class="filter-chip" data-type="series">Series</button>
      </div>
      <div class="genre-wrap" id="genreFilters" aria-label="Filter genre"></div>
      <p id="statusMessage" class="status" role="status">Mengambil database...</p>
      <div id="movieGrid" class="movie-grid"></div>
      <p id="emptyMessage" class="empty-message" hidden>Konten tidak ditemukan.</p>
      <nav class="pagination" id="pagination" aria-label="Navigasi halaman"></nav>
    </section>

    <dialog class="detail-dialog" id="detailDialog">
      <button class="dialog-close" id="closeDetail" type="button" aria-label="Tutup">×</button>
      <img class="detail-poster" id="detailPoster" alt="Poster">
      <div class="detail-content">
        <span class="content-type-label" id="detailType"></span>
        <h2 id="detailTitle"></h2>
        <p class="metadata" id="detailMeta"></p>
        <p class="detail-description" id="detailDescription"></p>
        <div class="detail-actions">
          <button class="primary-button" id="detailWatch" type="button">▶ Tonton</button>
          <button class="favorite-button" id="detailFavorite" type="button">♡ Favorit</button>
        </div>
        <section id="seriesArea" class="series-area" hidden>
          <label for="seasonSelect">Pilih season</label>
          <select id="seasonSelect"></select>
          <div id="episodeList" class="episode-list"></div>
        </section>
      </div>
    </dialog>

    <dialog id="playerDialog" class="player-dialog">
      <button id="closePlayer" class="dialog-close" type="button" aria-label="Tutup pemutar">×</button>
      <div class="player-container">
        <iframe id="videoFrame" src="about:blank" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="no-referrer"></iframe>
      </div>
    </dialog>
  </main>

  <nav class="bottom-nav" aria-label="Navigasi utama">
    <a class="active" href="#" id="homeNav"><span>⌂</span>Beranda</a>
    <a href="#catalog-section" id="filmsNav"><span>▣</span>Film</a>
    <a href="#catalog-section" id="seriesNav"><span>▤</span>Series</a>
    <a href="#catalog-section" id="favoritesNav"><span>♡</span>Favorit</a>
  </nav>
  <script src="js/app.js"></script>
</body>
</html>
